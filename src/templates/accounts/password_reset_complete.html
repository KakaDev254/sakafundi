{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete - SakaFundi{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-3" style="background: #ffffff;">
                <div class="card-body p-5 text-center" style="background: #ffffff;">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px; background: #D1FAE5; border-radius: 50%;">
                            <i class="fas fa-check-circle" style="font-size: 2rem; color: #10B981;"></i>
                        </div>
                    </div>
                    
                    <h4 class="fw-bold" style="color: #0A1628;">Password Reset Complete</h4>
                    
                    <p class="text-muted small mt-3" style="color: #64748B;">
                        Your password has been reset successfully. 
                        You can now login with your new password.
                    </p>
                    
                    <hr class="my-4" style="border-color: #E2E8F0;">
                    
                    <div class="d-grid gap-2">
                        <a href="{% url 'account_login' %}" class="btn py-2 fw-semibold" style="background: #2563EB; color: #ffffff; border-radius: 8px; transition: all 0.2s ease;"
                           onmouseover="this.style.background='#1D4ED8'; transform: translateY(-1px);"
                           onmouseout="this.style.background='#2563EB'; transform: translateY(0);">
                            <i class="fas fa-sign-in-alt me-2"></i> Login Now
                        </a>
                        <a href="{% url 'core:home' %}" class="btn btn-outline-secondary py-2 fw-semibold" style="border-radius: 8px; border-color: #E2E8F0; color: #64748B;">
                            <i class="fas fa-home me-2"></i> Return Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background: #f8fafc;
    }
    
    .card {
        background: #ffffff !important;
    }
    
    .card-body {
        background: #ffffff !important;
    }
    
    .btn:hover {
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    
    @media (max-width: 576px) {
        .card-body {
            padding: 1.5rem !important;
        }
    }
</style>
{% endblock %}
