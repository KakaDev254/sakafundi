{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete - SakaFundi{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px; background: #D1FAE5; border-radius: 50%;">
                            <i class="fas fa-check-circle" style="font-size: 2.5rem; color: #10B981;"></i>
                        </div>
                    </div>
                    
                    <h3 class="fw-bold" style="color: #0F172A;">Password Reset Complete</h3>
                    
                    <p class="text-secondary mt-3">
                        Your password has been reset successfully. 
                        You can now login with your new password.
                    </p>
                    
                    <hr class="my-4" style="border-color: #E2E8F0;">
                    
                    <div class="d-grid gap-2">
                        <a href="{% url 'accounts:login' %}" class="btn py-2 fw-semibold" style="background: #F59E0B; color: #fff; border-radius: 12px; transition: all 0.3s ease;"
                           onmouseover="this.style.background='#D97706'; transform: translateY(-2px);"
                           onmouseout="this.style.background='#F59E0B'; transform: translateY(0);">
                            <i class="fas fa-sign-in-alt me-2"></i> Login Now
                        </a>
                        <a href="{% url 'core:home' %}" class="btn btn-outline-secondary py-2 fw-semibold" style="border-radius: 12px; border-color: #E2E8F0; color: #64748B;">
                            <i class="fas fa-home me-2"></i> Return Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .btn:hover {
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
</style>
{% endblock %}
