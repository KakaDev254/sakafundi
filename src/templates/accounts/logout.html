{% extends 'base.html' %}
{% load static %}

{% block title %}Logout - SakaFundi{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px; background: #FEF3C7; border-radius: 50%;">
                            <i class="fas fa-sign-out-alt" style="font-size: 2.5rem; color: #F59E0B;"></i>
                        </div>
                    </div>
                    
                    <h3 class="fw-bold" style="color: #0F172A;">Logout</h3>
                    
                    <p class="text-secondary mt-3">
                        Are you sure you want to logout of your SakaFundi account?
                    </p>
                    
                    <hr class="my-4" style="border-color: #E2E8F0;">
                    
                    <div class="d-grid gap-2">
                        <form method="post" action="{% url 'accounts:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn w-100 py-2 fw-semibold" 
                                    style="background: #EF4444; color: #fff; border-radius: 12px; transition: all 0.3s ease;"
                                    onmouseover="this.style.background='#DC2626'; transform: translateY(-2px);"
                                    onmouseout="this.style.background='#EF4444'; transform: translateY(0);">
                                <i class="fas fa-sign-out-alt me-2"></i> Yes, Logout
                            </button>
                        </form>
                        <a href="{% url 'core:home' %}" class="btn btn-outline-secondary py-2 fw-semibold" style="border-radius: 12px; border-color: #E2E8F0; color: #64748B;">
                            <i class="fas fa-arrow-left me-2"></i> Cancel, Stay Logged In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .btn:hover {
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }
</style>
{% endblock %}
