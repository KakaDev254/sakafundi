{% extends 'base.html' %}
{% load static %}
{% load widget_tweaks %}
{% load cloudinary %}

{% block title %}Settings - SakaFundi{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-3" style="color: #0F172A;">
                        <i class="fas fa-cog" style="color: #2563EB;"></i> Account Settings
                    </h4>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control rounded-3" 
                                   value="{{ user.email }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="text" name="phone_number" class="form-control rounded-3" 
                                   value="{{ user.phone_number }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Notification Preferences</label>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="email_notifications" checked>
                                <label class="form-check-label" for="email_notifications">Email Notifications</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="sms_notifications" checked>
                                <label class="form-check-label" for="sms_notifications">SMS Notifications</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary rounded-3 px-4">
                            <i class="fas fa-save"></i> Save Settings
                        </button>
                    </form>
                    
                    <hr>
                    
                    <div class="d-flex gap-2">
                        <a href="{% url 'accounts:become_provider' %}" class="btn btn-warning rounded-3">
                            <i class="fas fa-user-plus"></i> Become a Provider
                        </a>
                        <a href="{% url 'accounts:delete_account' %}" class="btn btn-danger rounded-3">
                            <i class="fas fa-trash"></i> Delete Account
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
