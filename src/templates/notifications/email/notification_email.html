<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #2563EB; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; background: #f8f9fa; }
        .button { display: inline-block; background: #2563EB; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🔔 {{ notification.title }}</h2>
        </div>
        <div class="content">
            <p>{{ notification.message|linebreaks }}</p>
            {% if notification.link %}
                <p style="text-align: center; margin-top: 20px;">
                    <a href="{{ site_url }}{{ notification.link }}" class="button">View Details</a>
                </p>
            {% endif %}
            <hr>
            <p style="font-size: 12px; color: #6c757d;">
                You received this notification from SakaFundi.
                <a href="{{ site_url }}{% url 'notifications:preferences' %}">Manage your preferences</a>
            </p>
        </div>
        <div class="footer">
            &copy; {% now "Y" %} SakaFundi. All rights reserved.
        </div>
    </div>
</body>
</html>
