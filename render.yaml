# render.yaml
services:
  # Web Service
  - type: web
    name: sakafundi
    runtime: python
    buildCommand: |
      cd src
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: cd src && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DATABASE_URL
        fromDatabase:
          name: sakafundi_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sakafundi_redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,sakafundi.onrender.com
      - key: DJANGO_ENV
        value: production
      # M-PESA Environment Variables
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_BASE_URL
        value: "https://api.safaricom.co.ke"
      - key: MPESA_TIMEOUT_URL
        sync: false
      - key: MPESA_RESULT_URL
        sync: false
      # Email Settings
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Platform Settings
      - key: PLATFORM_FEE_PERCENTAGE
        value: "10"
      - key: DEPOSIT_DEFAULT_PERCENTAGE
        value: "30"
      - key: CURRENCY
        value: "KES"
      - key: CURRENCY_SYMBOL
        value: "KSh"

  # Redis Service
  - type: redis
    name: sakafundi_redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: sakafundi_db
    plan: free  # Upgrade to paid plan for production
    databaseName: sakafundi
    user: sakafundi_user